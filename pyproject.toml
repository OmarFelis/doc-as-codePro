[tool.poetry]
name = "doc-as-code-service"
version = "3.0.0"
description = "Servicio moderno de documentación automática con IA"
authors = ["Alignet Team <tech@alignet.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
openai = "^1.10.0"
tiktoken = "^0.5.2"
requests = "^2.31.0"
redis = "^5.0.1"
celery = "^5.3.4"
sqlalchemy = "^2.0.25"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
structlog = "^24.1.0"
tenacity = "^9.1.2"
prometheus-client = "^0.19.0"
python-multipart = "^0.0.9"
httpx = "^0.27.0"
# Fase 2: Parsers multi-lenguaje
javalang = "^0.13.0"
esprima = "^4.0.1"
tree-sitter = "^0.21.0"
# Fase 2: API instrumentación
prometheus-fastapi-instrumentator = "^6.1.0"
# Fase 2: Integraciones
atlassian-python-api = "^3.41.0"
boto3 = "^1.34.0"
strands-agents = ">=0.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
black = "^24.1.1"
ruff = "^0.1.14"
mypy = "^1.8.0"
pre-commit = "^3.6.0"
faker = "^22.0.0"

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=html --cov-report=term-missing"
markers = [
    "integration: tests que requieren servicios externos (Bedrock, DB)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
